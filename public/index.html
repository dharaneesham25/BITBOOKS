<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bit Books — Campus Resource Booking</title>
<style>
:root{--ink:#16233f;--paper:#f7f5ef;--panel:#fff;--muted:#6b6558;--line:#e4dfd1;--accent:#a9803f;--danger:#9c4238;--ok:#4f6e52}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;font-weight:700}.primary{background:var(--ink);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff;color:var(--danger);border:1px solid #e0b7ae}.wrap{max-width:1100px;margin:auto;padding:24px}.top{background:var(--ink);color:#fff;padding:22px 0}.topin{max-width:1100px;margin:auto;padding:0 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-family:Georgia,serif;font-size:26px;font-weight:700}.sub{opacity:.75;font-size:13px;margin-top:4px}.role{display:flex;background:#ffffff1f;padding:4px;border-radius:10px}.role button{background:transparent;color:#fff}.role .active{background:#fff;color:var(--ink)}.tabs{display:flex;gap:6px;margin:24px 0;background:#fff;border:1px solid var(--line);padding:5px;border-radius:10px}.tabs button{background:transparent;color:var(--muted)}.tabs .active{background:var(--ink);color:#fff}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.pagehead h1{font-family:Georgia,serif;margin:0}.pagehead p{color:var(--muted);margin:6px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.card h2{font-family:Georgia,serif;margin:0;padding:18px;border-bottom:1px solid var(--line);font-size:20px}.body{padding:18px}.resource{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.resource:last-child{border-bottom:0}.name{font-weight:700}.meta{color:var(--muted);font-size:13px;margin-top:4px}.tag{display:inline-block;background:#f1eadc;color:#7a5b25;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:700}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form input,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.booking{padding:15px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.5fr 1fr auto;gap:12px;align-items:center}.booking:last-child{border-bottom:0}.status{font-size:12px;font-weight:700;padding:5px 8px;border-radius:10px;background:#eee}.pending{background:#f1e3c4;color:#7a5b12}.confirmed{background:#dfe9dd;color:var(--ok)}.cancelled,.rejected{background:#f1dad6;color:var(--danger)}.completed{background:#e4e5e7}.empty{text-align:center;color:var(--muted);padding:30px}.notice{padding:10px 12px;border-radius:8px;background:#f1dad6;color:var(--danger);font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:9px;display:none}.small{font-size:12px;color:var(--muted)}@media(max-width:760px){.grid,.two{grid-template-columns:1fr}.topin{align-items:flex-start;flex-direction:column}.booking{grid-template-columns:1fr}.tabs{overflow:auto}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div><div class="brand">Bit Books</div><div class="sub">Campus Resource Booking System</div></div><div class="role"><button id="studentBtn" class="active">Student</button><button id="adminBtn">Admin</button></div></div></header>
<main class="wrap">
<nav class="tabs" id="tabs"></nav>
<div id="app"></div>
</main>
<div id="toast" class="toast"></div>
<script>
const state={role:"student",view:"browse",resources:[],bookings:[],selected:null};
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||"Request failed");e.status=r.status;throw e}return d}
async function refresh(){[state.resources,state.bookings]=await Promise.all([api("/api/resources"),api("/api/bookings")]);render()}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2500)}
function resource(id){return state.resources.find(r=>r.id===id)}
function status(s){return '<span class="status '+s+'">'+s[0].toUpperCase()+s.slice(1)+'</span>'}
function tabs(){let a=state.role==="student"?[["browse","Browse"],["mine","My Bookings"]]:[["resources","Resources"],["queue","Requests"],["all","All Bookings"]];$("tabs").innerHTML=a.map(x=>'<button class="'+(state.view===x[0]?"active":"")+'" data-view="'+x[0]+'">'+x[1]+'</button>').join("");document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()})}
function render(){tabs();if(state.role==="student"){if(state.view==="browse")browse();else mine()}else{if(state.view==="resources")adminResources();else if(state.view==="queue")queue();else allBookings()}}
function browse(){let list=state.resources.map(r=>'<div class="resource"><div><div class="name">'+r.name+'</div><div class="meta">'+r.location+' · Capacity '+r.capacity+'</div><span class="tag">'+r.type+'</span></div><button class="primary" data-book="'+r.id+'">Book</button></div>').join("");$("app").innerHTML='<div class="pagehead"><div><h1>Find a space</h1><p>Choose a classroom, laboratory or shared facility and request a suitable time.</p></div></div><div class="grid"><section class="card"><h2>Available resources</h2>'+ (list||'<div class="empty">No resources available.</div>')+'</section><section class="card"><h2>Booking a resource</h2><div class="body">'+(state.selected?bookingForm():'<div class="empty">Select a resource to start a booking.</div>')+'</div></section></div>';document.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.book;render()});bindBooking()}
function bookingForm(){let r=resource(state.selected);return '<p><b>'+r.name+'</b><br><span class="small">'+r.location+' · '+r.type+' · Capacity '+r.capacity+'</span></p><form class="form" id="bookForm"><label>Your name<input id="userName" required placeholder="Your name"></label><div class="two"><label>Date<input id="date" type="date" required></label><label>Purpose<input id="purpose" required placeholder="e.g. Project meeting"></label></div><div class="two"><label>Start<input id="start" type="time" required></label><label>End<input id="end" type="time" required></label></div><div id="conflict"></div><button class="primary">Submit booking</button></form>'}
function bindBooking(){const f=$("bookForm");if(!f)return;f.oninput=check;f.onsubmit=async e=>{e.preventDefault();try{await api("/api/bookings",{method:"POST",body:JSON.stringify({resourceId:state.selected,userName:$("userName").value,date:$("date").value,start:$("start").value,end:$("end").value,purpose:$("purpose").value})});state.selected=null;await refresh();toast("Booking submitted.")}catch(err){toast(err.message)}}}
async function check(){const d=$("date").value,s=$("start").value,e=$("end").value;if(!d||!s||!e||e<=s){$("conflict").innerHTML="";return}const x=await api("/api/bookings/check-conflict?resourceId="+encodeURIComponent(state.selected)+"&date="+d+"&start="+s+"&end="+e);$("conflict").innerHTML=x.conflict?'<div class="notice">Already booked from '+x.conflict.start+' to '+x.conflict.end+'. Choose another time.</div>':""}
function mine(){let rows=state.bookings.filter(b=>b.userName===currentName());let html=rows.map(b=>'<div class="booking"><div><div class="name">'+(resource(b.resourceId)?.name||"Deleted resource")+'</div><div class="meta">'+b.date+' · '+b.start+'–'+b.end+' · '+b.purpose+'</div></div><div>'+status(b.status)+'</div><div>'+(["pending","confirmed"].includes(b.status)?'<button class="danger" data-cancel="'+b.id+'">Cancel</button>':"")+'</div></div>').join("");$("app").innerHTML='<div class="pagehead"><div><h1>My bookings</h1><p>Bookings are stored on the campus server.</p></div></div><section class="card">'+(html||'<div class="empty">No bookings under this name yet.</div>')+'</section>';document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{await api("/api/bookings/"+b.dataset.cancel+"/cancel",{method:"POST"});await refresh();toast("Booking cancelled.")})}
function currentName(){return localStorage.getItem("bitbooks_name")||""}
function adminResources(){let list=state.resources.map(r=>'<div class="resource"><div><div class="name">'+r.name+'</div><div class="meta">'+r.location+' · Capacity '+r.capacity+'</div><span class="tag">'+r.type+'</span> '+(r.approval?'<span class="tag">Approval required</span>':"")+'</div><button class="danger" data-delete="'+r.id+'">Delete</button></div>').join("");$("app").innerHTML='<div class="pagehead"><div><h1>Manage resources</h1><p>Add and remove campus spaces.</p></div></div><div class="grid"><section class="card"><h2>Add resource</h2><div class="body"><form class="form" id="resForm"><label>Name<input id="rname" required></label><label>Type<select id="rtype"><option>Classroom</option><option>Laboratory</option><option>Seminar Room</option><option>Facility</option></select></label><label>Location<input id="rlocation" required></label><label>Capacity<input id="rcapacity" type="number" min="1" required></label><label><input id="rapproval" type="checkbox" style="width:auto"> Requires admin approval</label><button class="primary">Add resource</button></form></div></section><section class="card"><h2>Current resources</h2>'+list+'</section></div>';document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this resource?")){await api("/api/resources/"+b.dataset.delete,{method:"DELETE"});await refresh();toast("Resource removed.")}});$("resForm").onsubmit=async e=>{e.preventDefault();await api("/api/resources",{method:"POST",body:JSON.stringify({name:$("rname").value,type:$("rtype").value,location:$("rlocation").value,capacity:$("rcapacity").value,approval:$("rapproval").checked})});await refresh();toast("Resource added.")}}
function queue(){let rows=state.bookings.filter(b=>b.status==="pending");let html=rows.map(b=>'<div class="booking"><div><div class="name">'+(resource(b.resourceId)?.name||"Unknown")+'</div><div class="meta">'+b.userName+' · '+b.date+' · '+b.start+'–'+b.end+' · '+b.purpose+'</div></div><div>'+status(b.status)+'</div><div><button class="primary" data-approve="'+b.id+'">Approve</button> <button class="danger" data-reject="'+b.id+'">Reject</button></div></div>').join("");$("app").innerHTML='<div class="pagehead"><div><h1>Booking requests</h1><p>Review requests that require approval.</p></div></div><section class="card">'+(html||'<div class="empty">Nothing waiting for approval.</div>')+'</section>';bindAdminActions()}
function allBookings(){let html=state.bookings.map(b=>'<div class="booking"><div><div class="name">'+(resource(b.resourceId)?.name||"Unknown")+'</div><div class="meta">'+b.userName+' · '+b.date+' · '+b.start+'–'+b.end+' · '+b.purpose+'</div></div><div>'+status(b.status)+'</div><div>'+(b.status==="confirmed"?'<button class="ghost" data-complete="'+b.id+'">Complete</button>':"")+'</div></div>').join("");$("app").innerHTML='<div class="pagehead"><div><h1>All bookings</h1><p>Full booking record across campus resources.</p></div></div><section class="card">'+(html||'<div class="empty">No bookings recorded yet.</div>')+'</section>';bindAdminActions()}
function bindAdminActions(){document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{await api("/api/bookings/"+b.dataset.approve+"/approve",{method:"POST"});await refresh();toast("Booking approved.")});document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=async()=>{await api("/api/bookings/"+b.dataset.reject+"/reject",{method:"POST"});await refresh();toast("Booking rejected.")});document.querySelectorAll("[data-complete]").forEach(b=>b.onclick=async()=>{await api("/api/bookings/"+b.dataset.complete+"/complete",{method:"POST"});await refresh();toast("Marked completed.")})}
$("studentBtn").onclick=()=>{state.role="student";state.view="browse";render()};$("adminBtn").onclick=()=>{state.role="admin";state.view="resources";render()};
refresh().catch(e=>$("app").innerHTML='<div class="card"><div class="empty">Could not reach the server.<br><span class="small">'+e.message+'</span></div></div>');
</script>
</body>
</html>
